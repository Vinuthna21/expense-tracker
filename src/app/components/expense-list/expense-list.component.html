<div class="card p-3">
  <h4>Expense List</h4>
  <table class="table">
    <thead>
      <tr>
        <th>Amount</th>
        <th>Category</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let expense of expenses">
        <td>{{ expense.amount }}</td>
        <td>{{ expense.category }}</td>
        <td>{{ expense.date }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="deleteExpense(expense.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<p>expense-list works!</p>
